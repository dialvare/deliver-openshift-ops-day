---
# HEALTHCHECK — Kubernetes resource checks
# A quick, module-agnostic check that core Kubernetes resources are present and
# available: nodes Ready, ClusterOperators Available/not Degraded, the Showroom
# pod Running, and operator Subscriptions installed. It does NOT check
# individual modules (that's what e2e.yml does) -- it looks at the cluster's
# core resources as a whole. Read-only, completes in a few seconds.
#
# Authentication (login) is established via tasks/_auth.yml:
#   CLI mode:     ansible-playbook qa-automation/healthcheck.yml \
#                   -e ocp_api_url=https://api.cluster-xxx:6443 \
#                   -e ocp_admin_password=<password>
#   Ambient mode: ansible-playbook qa-automation/healthcheck.yml
#                 (uses the active kubeconfig / in-cluster SA)
#
# Every check is collected instead of failing fast, so one run reports
# everything that's broken at once. Exit 0 = healthy, non-zero = unhealthy.

- name: Environment Health Check
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
  vars:
    monorepo_path: /showroom/repo
    hc_failures: []
  tasks:

    # -- Authentication (login) ----------------------------------------

    - name: "Auth | Establish cluster authentication"
      ansible.builtin.include_tasks: tasks/_auth.yml

    # -- Combined availability checks (not per module) -----------------

    - name: "Base | Monorepo is cloned at expected path"
      ansible.builtin.stat:
        path: "{{ monorepo_path }}"
      register: repo_stat
      ignore_errors: true

    - name: "Base | Record failure if monorepo is missing"
      ansible.builtin.set_fact:
        hc_failures: "{{ hc_failures + ['base: monorepo not found at ' + monorepo_path] }}"
      when: >-
        repo_stat is failed or
        not repo_stat.stat.exists or not repo_stat.stat.isdir

    - name: "Base | Nodes are Ready"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: cluster_nodes
      ignore_errors: true

    - name: "Base | Record failure if the node list could not be read"
      ansible.builtin.set_fact:
        hc_failures: "{{ hc_failures + ['base: could not list cluster nodes'] }}"
      when: >-
        cluster_nodes is failed or
        cluster_nodes.resources | default([]) | length == 0

    - name: "Base | Record failure for any node that is not Ready"
      ansible.builtin.set_fact:
        hc_failures: "{{ hc_failures + ['base: node ' + item.metadata.name + ' is not Ready'] }}"
      loop: "{{ cluster_nodes.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: >-
        item.status.conditions | default([])
          | selectattr('type', 'equalto', 'Ready')
          | selectattr('status', 'equalto', 'True')
          | list | length == 0

    - name: "Base | ClusterOperators are Available"
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: ClusterOperator
      register: cluster_operators
      ignore_errors: true

    # Only fail if an operator is actually not Available (i.e. it is down).
    # A momentarily Degraded-but-Available operator (e.g. csi-snapshot-controller
    # during snapshot CRD churn) is still serving, so it is not treated as a
    # healthcheck failure here.
    - name: "Base | Record failure if any ClusterOperator is not Available"
      ansible.builtin.set_fact:
        hc_failures: >-
          {{ hc_failures + ['base: ClusterOperator ' + item.metadata.name + ' is not Available'] }}
      loop: "{{ cluster_operators.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: >-
        item.status.conditions | default([]) | selectattr('type', 'equalto', 'Available') | selectattr('status', 'equalto', 'True') | list | length == 0

    - name: "Base | Showroom pod is running"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        label_selectors:
          - app.kubernetes.io/name=showroom
      register: showroom_pods
      ignore_errors: true

    - name: "Base | Record failure if Showroom pod is not running"
      ansible.builtin.set_fact:
        hc_failures: "{{ hc_failures + ['base: no Running Showroom pod found'] }}"
      when: >-
        showroom_pods is failed or
        showroom_pods.resources | default([]) | length == 0 or
        showroom_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length == 0

    - name: "Base | Operator Subscriptions are installed"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
      register: operator_subscriptions
      ignore_errors: true

    - name: "Base | Record failure if no operator Subscriptions are installed"
      ansible.builtin.set_fact:
        hc_failures: "{{ hc_failures + ['base: no operator Subscriptions found'] }}"
      when: >-
        operator_subscriptions is failed or
        operator_subscriptions.resources | default([]) | length == 0

    # -- Report ----------------------------------------------------------

    - name: Report healthy
      ansible.builtin.debug:
        msg: "Healthcheck passed, no failures found"
      when: hc_failures | length == 0

    - name: Fail if any checks failed
      ansible.builtin.fail:
        msg: "{{ hc_failures }}"
      when: hc_failures | length > 0
